---
# Molecule / integration tests — three gates keep this from running on
# every push:
#
#   1. Path filter: only role, plugin, test, or workflow changes trigger
#      it. Docs, README, and release-machinery churn never do.
#   2. Label gate: the Windows job (slower, WinRM setup on a
#      windows-latest runner) additionally requires the `test-windows`
#      label on the PR.
#   3. workflow_dispatch: both jobs can be forced manually; the Windows
#      job via the run_windows input.
#
# Superseded runs on the same ref are cancelled (concurrency), so rapid
# pushes don't stack runners.
name: Molecule

on:
  pull_request:
    branches: [main]
    paths:
      - 'roles/**'
      - 'plugins/**'
      - 'tests/**'
      - 'requirements.yml'
      - 'requirements.txt'
      - '.github/workflows/molecule.yml'
  push:
    branches: [main]
    paths:
      - 'roles/**'
      - 'plugins/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      run_windows:
        description: Also run the Windows job
        type: boolean
        default: false

concurrency:
  group: molecule-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install test tooling (pinned)
        run: pip install -r requirements.txt

      - name: Molecule test
        run: molecule test
        working-directory: roles/can_i_reach
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"

  windows:
    runs-on: windows-latest
    # Gate: PR label `test-windows`, or a manual dispatch with run_windows.
    if: >-
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'test-windows')) ||
      (github.event_name == 'workflow_dispatch' && inputs.run_windows)
    steps:
      - uses: actions/checkout@v7

      - name: Configure WinRM, OpenSSH and the test user on the runner
        shell: pwsh
        run: |
          $pw = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 24 | ForEach-Object {[char]$_}) + "aA1!"
          New-LocalUser -Name ansible-test -Password (ConvertTo-SecureString $pw -AsPlainText -Force) -PasswordNeverExpires | Out-Null
          Add-LocalGroupMember -Group Administrators -Member ansible-test
          "ANSIBLE_TEST_PW=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # WinRM transport
          Enable-PSRemoting -Force -SkipNetworkProfileCheck
          Set-Item WSMan:\localhost\Service\Auth\Basic -Value $true
          Set-Item WSMan:\localhost\Service\AllowUnencrypted -Value $true
          New-NetFirewallRule -DisplayName "WinRM-WSL" -Direction Inbound -LocalPort 5985 -Protocol TCP -Action Allow | Out-Null
          # SSH transport (Windows OpenSSH server, PowerShell as default shell)
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0 | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\OpenSSH" -Name DefaultShell -Value "C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe" -PropertyType String -Force | Out-Null
          Set-Service sshd -StartupType Automatic
          Start-Service sshd
          New-NetFirewallRule -DisplayName "SSH-WSL" -Direction Inbound -LocalPort 22 -Protocol TCP -Action Allow | Out-Null

      - uses: Vampire/setup-wsl@v7
        with:
          distribution: Ubuntu-24.04
          additional-packages: python3-pip python3-venv sshpass

      - name: Install ansible in WSL
        shell: wsl-bash {0}
        run: |
          python3 -m venv ~/venv
          ~/venv/bin/pip install --quiet "ansible-core==2.21.3" pywinrm
          ~/venv/bin/ansible-galaxy collection install -r requirements.yml
          ~/venv/bin/ansible-galaxy collection install . --force

      - name: Run the Windows preflight test (WinRM)
        shell: wsl-bash {0}
        run: |
          HOST_IP=$(ip route show default | awk '{print $3}')
          # WinRM can lag Enable-PSRemoting on fresh runners — wait for it
          for i in $(seq 1 10); do
            if ~/venv/bin/python -c "
          import socket,sys
          s=socket.socket(); s.settimeout(3)
          sys.exit(0 if s.connect_ex(('$HOST_IP',5985))==0 else 1)"; then break; fi
            echo "waiting for WinRM ($i)"; sleep 6
          done
          cat > inventory-winrm.ini <<INV
          [windows]
          winhost ansible_host=$HOST_IP
          [windows:vars]
          ansible_user=ansible-test
          ansible_password=$ANSIBLE_TEST_PW
          ansible_connection=winrm
          ansible_port=5985
          ansible_winrm_transport=basic
          ansible_winrm_server_cert_validation=ignore
          INV
          ~/venv/bin/ansible-playbook -i inventory-winrm.ini tests/windows/preflight.yml || { echo "retrying after transport hiccup"; sleep 15; ~/venv/bin/ansible-playbook -i inventory-winrm.ini tests/windows/preflight.yml; }
        env:
          WSLENV: ANSIBLE_TEST_PW/u

      - name: Run the Windows preflight test (SSH)
        shell: wsl-bash {0}
        run: |
          HOST_IP=$(ip route show default | awk '{print $3}')
          cat > inventory-ssh.ini <<INV
          [windows]
          winhost ansible_host=$HOST_IP
          [windows:vars]
          ansible_user=ansible-test
          ansible_password=$ANSIBLE_TEST_PW
          ansible_connection=ssh
          ansible_shell_type=powershell
          ansible_ssh_common_args=-o StrictHostKeyChecking=no
          INV
          ~/venv/bin/ansible-playbook -i inventory-ssh.ini tests/windows/preflight.yml || { echo "retrying after transport hiccup"; sleep 15; ~/venv/bin/ansible-playbook -i inventory-ssh.ini tests/windows/preflight.yml; }
        env:
          WSLENV: ANSIBLE_TEST_PW/u
