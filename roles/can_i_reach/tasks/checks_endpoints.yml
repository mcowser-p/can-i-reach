---
# Layer: endpoint — the generic "can I reach host:port / url" checks.
# Every probe is a flat module loop that never fails on its own unless
# can_i_reach_fail_fast is set; the Record tasks fold the registered
# results into can_i_reach_result.

- name: Classify endpoint entries
  ansible.builtin.set_fact:
    _can_i_reach_ep_plain: >-
      {{ (can_i_reach_endpoints | rejectattr('protocol', 'defined') | list
          + can_i_reach_endpoints | selectattr('protocol', 'defined')
            | selectattr('protocol', 'eq', 'tcp') | list)
         | rejectattr('path', 'defined') | list }}
    _can_i_reach_ep_http: >-
      {{ (can_i_reach_endpoints | rejectattr('protocol', 'defined') | list
          + can_i_reach_endpoints | selectattr('protocol', 'defined')
            | selectattr('protocol', 'eq', 'tcp') | list)
         | selectattr('path', 'defined') | list }}
    _can_i_reach_ep_udp: >-
      {{ can_i_reach_endpoints | selectattr('protocol', 'defined')
         | selectattr('protocol', 'eq', 'udp') | list }}
    _can_i_reach_ep_icmp: >-
      {{ can_i_reach_endpoints | selectattr('protocol', 'defined')
         | selectattr('protocol', 'eq', 'icmp') | list }}

# --- tcp ---------------------------------------------------------------------
- name: Probe TCP endpoints
  when: not _can_i_reach_windows
  ansible.builtin.wait_for:
    host: "{{ _can_i_reach_ep.host }}"
    port: "{{ _can_i_reach_ep.port }}"
    timeout: "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) }}"
  register: _can_i_reach_tcp_reg
  check_mode: false
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_plain }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}"

- name: Probe TCP endpoints (windows)
  when: _can_i_reach_windows
  ansible.windows.win_wait_for:
    host: "{{ _can_i_reach_ep.host }}"
    port: "{{ _can_i_reach_ep.port }}"
    timeout: "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) }}"
  register: _can_i_reach_tcp_reg_win
  check_mode: false
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_plain }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}"

- name: Record TCP endpoint results
  vars:
    _ep: "{{ _can_i_reach_r._can_i_reach_ep }}"
    _reached: "{{ not (_can_i_reach_r.failed | default(false)) }}"
    _want_down: "{{ (_ep.expect | default('reachable')) == 'unreachable' }}"
    _ok: "{{ _reached != _want_down }}"
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': _ep.name | default('tcp:' ~ _ep.host ~ ':' ~ _ep.port),
           'layer': 'endpoint',
           'status': 'ok' if _ok else 'fail',
           'detail': (('connected in ' ~ (_can_i_reach_r.elapsed | default(0)) ~ 's')
                      if not _want_down
                      else ('REACHABLE - expected blocked (connected in '
                            ~ (_can_i_reach_r.elapsed | default(0)) ~ 's)'))
                     if _reached
                     else ((_can_i_reach_r.msg | default('unreachable'))
                           if not _want_down
                           else ('correctly blocked (' ~ (_can_i_reach_r.msg | default('no connect')) ~ ')')),
           'remediation': ''}]}) }}
  loop: >-
    {{ ((_can_i_reach_tcp_reg_win if _can_i_reach_windows else _can_i_reach_tcp_reg).results
        | default([])) | rejectattr('skipped', 'defined') | list }}
  loop_control:
    loop_var: _can_i_reach_r
    label: "{{ _can_i_reach_r._can_i_reach_ep.host }}:{{ _can_i_reach_r._can_i_reach_ep.port }}"

# --- udp ---------------------------------------------------------------------
- name: Probe UDP endpoints
  when: not _can_i_reach_windows
  mcowser_p.can_i_reach.udp_probe:
    host: "{{ _can_i_reach_ep.host }}"
    port: "{{ _can_i_reach_ep.port }}"
    timeout: "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) }}"
    tries: "{{ can_i_reach_tries }}"
    expect_reply: "{{ _can_i_reach_ep.expect_reply | default(false) }}"
  register: _can_i_reach_udp_reg
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_udp }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}"

- name: Probe UDP endpoints (windows)
  when: _can_i_reach_windows
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'udp_probe.ps1') }}"
    parameters:
      TargetHost: "{{ _can_i_reach_ep.host }}"
      Port: "{{ _can_i_reach_ep.port | int }}"
      TimeoutSec: "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) | float }}"
      Tries: "{{ can_i_reach_tries | int }}"
      Payload: empty
      ExpectReply: "{{ _can_i_reach_ep.expect_reply | default(false) | bool }}"
  register: _can_i_reach_udp_reg_win
  failed_when: >-
    can_i_reach_fail_fast
    and (_can_i_reach_ep.expect | default('reachable')) != 'unreachable'
    and (_can_i_reach_udp_reg_win.result.status | default('fail')) == 'fail'
  loop: "{{ _can_i_reach_ep_udp }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}"

- name: Record UDP endpoint results
  vars:
    _ep: "{{ _can_i_reach_r._can_i_reach_ep }}"
    _want_down: "{{ (_ep.expect | default('reachable')) == 'unreachable' }}"
    _status_up: >-
      {{ (_can_i_reach_r.result.status | default('fail')) if _can_i_reach_windows
         else ('fail' if _can_i_reach_r.failed | default(false)
               else ('ok' if _can_i_reach_r.state | default('') == 'responded' else 'warn')) }}
    # inverted reading: a reply is the failure, silence is the pass, and
    # ICMP port-unreachable (or any other probe failure) proves the host
    # was reached even though the port is closed - a warn, not a pass
    _state: >-
      {{ (_can_i_reach_r.result.status | default('fail')) if _can_i_reach_windows
         else (_can_i_reach_r.state | default('error')) }}
    _status_down: >-
      {{ 'fail' if (_state in ['responded', 'ok'])
         else ('ok' if (_state in ['open|filtered', 'warn']) else 'warn') }}
    _status: "{{ _status_down if _want_down else _status_up }}"
    _detail_raw: >-
      {{ (_can_i_reach_r.result.detail | default('probe script error')) if _can_i_reach_windows
         else (_can_i_reach_r.detail | default(_can_i_reach_r.msg | default('no detail'))) }}
    _detail: >-
      {{ _detail_raw if not _want_down
         else (('REACHABLE - expected blocked: ' ~ _detail_raw) if _status_down == 'fail'
               else (('correctly blocked: ' ~ _detail_raw) if _status_down == 'ok'
                     else ('host reached, port closed - not blocked by the network: ' ~ _detail_raw))) }}
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': _ep.name | default('udp:' ~ _ep.host ~ ':' ~ _ep.port),
           'layer': 'endpoint',
           'status': _status,
           'detail': _detail,
           'remediation': ''}]}) }}
  loop: >-
    {{ ((_can_i_reach_udp_reg_win if _can_i_reach_windows else _can_i_reach_udp_reg).results
        | default([])) | rejectattr('skipped', 'defined') | list }}
  loop_control:
    loop_var: _can_i_reach_r
    label: "{{ _can_i_reach_r._can_i_reach_ep.host }}:{{ _can_i_reach_r._can_i_reach_ep.port }}"

# --- http(s) -----------------------------------------------------------------
# Proxy resolution per entry: `proxy` on the entry, else can_i_reach_proxy,
# else the host's own environment (mode=system, nothing touched).
# `false|none|direct` or a host in can_i_reach_no_proxy forces a direct
# request; a value naming a can_i_reach_proxies entry pulls its url and
# credentials; anything else is a proxy URL. The anchor is reused by the
# record task so the report can say which proxy carried the request.
- name: Probe HTTP endpoints
  when: not _can_i_reach_windows
  vars: &can_i_reach_http_vars
    _scheme: >-
      {{ _can_i_reach_ep.scheme
         | default('https' if _can_i_reach_ep.port | int in [443, 8443] else 'http') }}
    _px_ref: "{{ _can_i_reach_ep.proxy | default(can_i_reach_proxy) | string }}"
    _px_mode: >-
      {{ 'direct' if (_px_ref | lower in ['false', 'none', 'direct']
                      or _can_i_reach_ep.host in can_i_reach_no_proxy)
         else ('system' if _px_ref | length == 0 else 'proxy') }}
    _px_named: >-
      {{ can_i_reach_proxies | selectattr('name', 'defined')
         | selectattr('name', 'eq', _px_ref) | list }}
    _px: "{{ _px_named[0] if _px_named | length > 0 else {'url': _px_ref} }}"
    _px_label: "{{ _px.name | default(_px.url | urlsplit('hostname')) }}"
    _px_creds: >-
      {{ (_px.username ~ ':' ~ _px.password ~ '@') if _px.username is defined else '' }}
    _px_env_url: "{{ _px.url | regex_replace('^(https?://)', '\\1' ~ _px_creds) }}"
    _px_env: >-
      {{ {'http_proxy': _px_env_url, 'https_proxy': _px_env_url,
          'HTTP_PROXY': _px_env_url, 'HTTPS_PROXY': _px_env_url,
          'no_proxy': '', 'NO_PROXY': ''}
         if _px_mode == 'proxy' else {} }}
  ansible.builtin.uri:
    url: "{{ _scheme }}://{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}{{ _can_i_reach_ep.path }}"
    status_code: "{{ _can_i_reach_ep.status_codes | default([200]) }}"
    validate_certs: "{{ _can_i_reach_ep.validate_certs | default(true) }}"
    timeout: "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) }}"
    use_proxy: "{{ _px_mode != 'direct' }}"
    follow_redirects: safe
    return_content: false
  environment: "{{ _px_env }}"
  register: _can_i_reach_http_reg
  check_mode: false
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_http }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}{{ _can_i_reach_ep.path }}"

- name: Probe HTTP endpoints (windows)
  when: _can_i_reach_windows
  vars: *can_i_reach_http_vars
  ansible.windows.win_uri:
    url: "{{ _scheme }}://{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}{{ _can_i_reach_ep.path }}"
    status_code: "{{ _can_i_reach_ep.status_codes | default([200]) }}"
    validate_certs: "{{ _can_i_reach_ep.validate_certs | default(true) }}"
    timeout: "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) }}"
    use_proxy: "{{ _px_mode != 'direct' }}"
    proxy_url: "{{ _px.url if _px_mode == 'proxy' else omit }}"
    proxy_username: "{{ _px.username if (_px_mode == 'proxy' and _px.username is defined) else omit }}"
    proxy_password: "{{ _px.password if (_px_mode == 'proxy' and _px.password is defined) else omit }}"
    return_content: false
  register: _can_i_reach_http_reg_win
  check_mode: false
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_http }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}:{{ _can_i_reach_ep.port }}{{ _can_i_reach_ep.path }}"

- name: Record HTTP endpoint results
  vars:
    <<: *can_i_reach_http_vars
    _can_i_reach_ep: "{{ _can_i_reach_r._can_i_reach_ep }}"
    _ep: "{{ _can_i_reach_r._can_i_reach_ep }}"
    _ok: "{{ not (_can_i_reach_r.failed | default(false)) }}"
    _got: "{{ _can_i_reach_r.status | default(_can_i_reach_r.status_code | default(-1)) }}"
    _via: >-
      {{ (' via proxy ' ~ _px_label) if _px_mode == 'proxy'
         else (' (direct, proxy bypassed)' if _px_mode == 'direct' else '') }}
    _want_down: "{{ (_ep.expect | default('reachable')) == 'unreachable' }}"
    # any HTTP status means something answered - except a proxy's own
    # 502/503/504, which is the proxy saying it could not get through
    _reached: >-
      {{ _got | int > 0
         and not (_px_mode == 'proxy' and _got | int in [502, 503, 504]) }}
    _status: >-
      {{ ('ok' if _ok else 'fail') if not _want_down
         else ('fail' if _reached else 'ok') }}
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': _ep.name | default(_scheme ~ ':' ~ _ep.host ~ ':' ~ _ep.port),
           'layer': 'endpoint',
           'status': _status,
           'detail': ((('status ' ~ _got ~ ' from ' ~ _ep.path) if _ok
                       else (_can_i_reach_r.msg | default('request failed') ~ ' (status ' ~ _got ~ ')'))
                      if not _want_down
                      else (('REACHABLE - expected blocked (status ' ~ _got ~ ' from ' ~ _ep.path ~ ')')
                            if _reached
                            else ('correctly blocked (no HTTP response: '
                                  ~ (_can_i_reach_r.msg | default('request failed')) ~ ')')))
                     ~ _via,
           'remediation': ''}]}) }}
  loop: >-
    {{ ((_can_i_reach_http_reg_win if _can_i_reach_windows else _can_i_reach_http_reg).results
        | default([])) | rejectattr('skipped', 'defined') | list }}
  loop_control:
    loop_var: _can_i_reach_r
    label: "{{ _can_i_reach_r._can_i_reach_ep.host }}:{{ _can_i_reach_r._can_i_reach_ep.port }}"

# --- icmp ---------------------------------------------------------------------
- name: Probe ICMP endpoints
  when: not _can_i_reach_windows
  ansible.builtin.command:
    argv:
      - ping
      - -c
      - "1"
      - -W
      - "{{ _can_i_reach_ep.timeout | default(can_i_reach_timeout) | int }}"
      - "{{ _can_i_reach_ep.host }}"
  register: _can_i_reach_icmp_reg
  check_mode: false
  changed_when: false
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_icmp }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}"

- name: Probe ICMP endpoints (windows)
  when: _can_i_reach_windows
  ansible.windows.win_shell: |
    if (Test-Connection -ComputerName '{{ _can_i_reach_ep.host }}' -Count 1 -Quiet) { exit 0 } else { exit 1 }
  register: _can_i_reach_icmp_reg_win
  check_mode: false
  changed_when: false
  # an entry expected to be blocked is allowed to fail its probe
  ignore_errors: >-
    {{ not can_i_reach_fail_fast
       or (_can_i_reach_ep.expect | default('reachable')) == 'unreachable' }}
  loop: "{{ _can_i_reach_ep_icmp }}"
  loop_control:
    loop_var: _can_i_reach_ep
    label: "{{ _can_i_reach_ep.host }}"

- name: Record ICMP endpoint results
  vars:
    _ep: "{{ _can_i_reach_r._can_i_reach_ep }}"
    _reached: "{{ _can_i_reach_r.rc | default(1) == 0 }}"
    _want_down: "{{ (_ep.expect | default('reachable')) == 'unreachable' }}"
    _ok: "{{ _reached != _want_down }}"
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': _ep.name | default('icmp:' ~ _ep.host),
           'layer': 'endpoint',
           'status': 'ok' if _ok else 'fail',
           'detail': ('ICMP reply received' if not _want_down
                      else 'REACHABLE - expected blocked (ICMP reply received)')
                     if _reached
                     else ('no ICMP reply (host down, or ICMP filtered)' if not _want_down
                           else 'correctly blocked (no ICMP reply)'),
           'remediation': ''}]}) }}
  loop: >-
    {{ ((_can_i_reach_icmp_reg_win if _can_i_reach_windows else _can_i_reach_icmp_reg).results
        | default([])) | rejectattr('skipped', 'defined') | list }}
  loop_control:
    loop_var: _can_i_reach_r
    label: "{{ _can_i_reach_r._can_i_reach_ep.host }}"

# Probes that were expected to be blocked cannot abort at probe time
# (their module call "succeeding" is the failure), so fail-fast for
# them is enforced here, after the whole endpoint layer is recorded.
- name: Fail fast on an endpoint that answered although it was expected to be blocked
  when:
    - can_i_reach_fail_fast
    - _can_i_reach_leaks | length > 0
  vars:
    _can_i_reach_leaks: >-
      {{ can_i_reach_result.checks | selectattr('layer', 'eq', 'endpoint')
         | selectattr('status', 'eq', 'fail')
         | selectattr('detail', 'search', 'expected blocked') | list }}
  ansible.builtin.fail:
    msg: >-
      {{ _can_i_reach_leaks | map(attribute='id') | join(', ') }}: reachable, but expected blocked
