---
# Layer: dc — domain controller reachability. The TCP port sweep covers
# the well-known AD set; DNS service on each DC is proven by real
# queries (the dns layer covers user queries via can_i_reach_dc_dns,
# and this layer adds a per-DC lookup of the domain apex when
# can_i_reach_ad_domain is set); NTP on the DCs is proven by the time
# layer's fallback. So 53/udp and 123/udp are tested by protocol, not
# by blind probes.

- name: Probe domain controller TCP ports
  when: not _can_i_reach_windows and not can_i_reach_dc_agentless
  ansible.builtin.wait_for:
    host: "{{ _can_i_reach_dcp.0.address }}"
    port: "{{ _can_i_reach_dcp.1 }}"
    timeout: "{{ can_i_reach_timeout }}"
  register: _can_i_reach_dcports_reg
  check_mode: false
  ignore_errors: "{{ not can_i_reach_fail_fast }}"
  loop: "{{ _can_i_reach_dcs | product(can_i_reach_dc_tcp_ports) | list }}"
  loop_control:
    loop_var: _can_i_reach_dcp
    label: "{{ _can_i_reach_dcp.0.address }}:{{ _can_i_reach_dcp.1 }}"

- name: Probe domain controller TCP ports (windows)
  when: _can_i_reach_windows and not can_i_reach_dc_agentless
  ansible.windows.win_wait_for:
    host: "{{ _can_i_reach_dcp.0.address }}"
    port: "{{ _can_i_reach_dcp.1 }}"
    timeout: "{{ can_i_reach_timeout }}"
  register: _can_i_reach_dcports_reg_win
  check_mode: false
  ignore_errors: "{{ not can_i_reach_fail_fast }}"
  loop: "{{ _can_i_reach_dcs | product(can_i_reach_dc_tcp_ports) | list }}"
  loop_control:
    loop_var: _can_i_reach_dcp
    label: "{{ _can_i_reach_dcp.0.address }}:{{ _can_i_reach_dcp.1 }}"

- name: Record domain controller port reachability
  when: not can_i_reach_dc_agentless
  vars:
    _all: >-
      {{ ((_can_i_reach_dcports_reg_win if _can_i_reach_windows else _can_i_reach_dcports_reg).results
          | default([])) | rejectattr('skipped', 'defined') | list }}
    _mine: "{{ _all | selectattr('_can_i_reach_dcp.0.address', 'eq', _can_i_reach_dc.address) | list }}"
    _bad: >-
      {{ _mine | selectattr('failed', 'defined') | selectattr('failed')
         | map(attribute='_can_i_reach_dcp.1') | list }}
    _dr: "{{ ' [DR]' if _can_i_reach_dc.dr | default(false) else '' }}"
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': 'dc:' ~ (_can_i_reach_dc.name | default(_can_i_reach_dc.address)),
           'layer': 'dc',
           'status': 'ok' if _bad | length == 0 else 'fail',
           'detail': (('all ' ~ (can_i_reach_dc_tcp_ports | length) ~ ' tcp ports reachable') if _bad | length == 0
                      else ('unreachable tcp: ' ~ (_bad | join(', ')))) ~ _dr,
           'remediation': '' if _bad | length == 0
                          else 'open the listed ports (3268/3269 = Global Catalog, 464 = kpasswd)'}]}) }}
  loop: "{{ _can_i_reach_dcs }}"
  loop_control:
    loop_var: _can_i_reach_dc
    label: "{{ _can_i_reach_dc.name | default(_can_i_reach_dc.address) }}"

# --- agentless port sweep -----------------------------------------------------
# Same verdicts as the sweep above, but through `raw`: no Python, no
# collections, no packages on the target. Each probe emits one sentinel
# line, CIR|host|port|status, so login banners and MOTD noise (which raw
# does not strip) are filtered out instead of being parsed as results.
#
# The outer loop is POSIX sh — bash is invoked explicitly for /dev/tcp
# because `sh` is dash on Debian/Ubuntu and has no such feature. Bare
# /dev/tcp has no timeout of its own and would hang on tcp_syn_retries
# (~130s) against a dropped SYN, so coreutils `timeout` bounds it and
# its exit code 124 is what separates FILTERED from REFUSED.

- name: Build the agentless probe list
  when:
    - can_i_reach_dc_agentless
    - _can_i_reach_dcs | length > 0
  ansible.builtin.set_fact:
    _can_i_reach_dc_pairs: >-
      {{ _can_i_reach_dcs | map(attribute='address')
         | product(can_i_reach_dc_tcp_ports) | map('join', ',') | join(' ') }}

- name: Sweep domain controller TCP ports agentlessly (linux)
  when:
    - can_i_reach_dc_agentless
    - not _can_i_reach_windows
    - _can_i_reach_dcs | length > 0
  ansible.builtin.raw: |
    command -v bash >/dev/null 2>&1 || { echo "CIR|*|*|nobash"; exit 0; }
    command -v timeout >/dev/null 2>&1 || { echo "CIR|*|*|notimeout"; exit 0; }
    for hp in {{ _can_i_reach_dc_pairs }}; do
      h=${hp%,*}; p=${hp#*,}
      timeout {{ can_i_reach_timeout }} bash -c "exec 3<>/dev/tcp/$h/$p" 2>/dev/null
      rc=$?
      if [ "$rc" -eq 0 ]; then s=ok
      elif [ "$rc" -eq 124 ]; then s=timeout
      else s=refused; fi
      echo "CIR|$h|$p|$s"
    done
  register: _can_i_reach_dcraw_reg
  changed_when: false
  check_mode: false

# .NET TcpClient with an async connect, NOT Test-NetConnection: that
# cmdlet takes no timeout and blocks ~20s per dropped port, which turns
# a full sweep of a firewalled DC into minutes.
- name: Sweep domain controller TCP ports agentlessly (windows)
  when:
    - can_i_reach_dc_agentless
    - _can_i_reach_windows
    - _can_i_reach_dcs | length > 0
  ansible.builtin.raw: >-
    $ErrorActionPreference='SilentlyContinue';
    foreach($hp in '{{ _can_i_reach_dc_pairs }}'.Split(' ')){
    $a=$hp.Split(',');$h=$a[0];$p=[int]$a[1];
    $c=New-Object Net.Sockets.TcpClient;
    try{$iar=$c.BeginConnect($h,$p,$null,$null);
    if($iar.AsyncWaitHandle.WaitOne({{ (can_i_reach_timeout | float * 1000) | int }},$false))
    {try{$c.EndConnect($iar);$s='ok'}catch{$s='refused'}}else{$s='timeout'}}
    catch{$s='refused'}finally{$c.Close()};
    Write-Output "CIR|$h|$p|$s"}
  register: _can_i_reach_dcraw_reg_win
  changed_when: false
  check_mode: false

- name: Record agentless domain controller port reachability
  when: can_i_reach_dc_agentless
  vars:
    _raw: "{{ _can_i_reach_dcraw_reg_win if _can_i_reach_windows else _can_i_reach_dcraw_reg }}"
    _rows: >-
      {{ (_raw.stdout_lines | default([])) | map('trim')
         | select('match', '^CIR[|]') | map('split', '|') | list }}
    _blocked: "{{ _rows | selectattr(3, 'in', ['nobash', 'notimeout']) | map(attribute=3) | list }}"
    _mine: "{{ _rows | selectattr(1, 'eq', _can_i_reach_dc.address) | list }}"
    _bad: "{{ _mine | rejectattr(3, 'eq', 'ok') | list }}"
    _bad_desc: >-
      {{ _bad | map(attribute=2) | zip(_bad | map(attribute=3))
         | map('join', ' ') | join(', ') }}
    _dr: "{{ ' [DR]' if _can_i_reach_dc.dr | default(false) else '' }}"
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': 'dc:' ~ (_can_i_reach_dc.name | default(_can_i_reach_dc.address)),
           'layer': 'dc',
           'status': 'skipped' if _blocked | length > 0
                     else ('ok' if _bad | length == 0 else 'fail'),
           'detail': (('no bash on the target - /dev/tcp unavailable'
                       if 'nobash' in _blocked else 'no coreutils timeout on the target')
                      if _blocked | length > 0
                      else (('all ' ~ (can_i_reach_dc_tcp_ports | length) ~ ' tcp ports reachable')
                            if _bad | length == 0
                            else ('unreachable tcp: ' ~ _bad_desc))) ~ _dr,
           'remediation': '' if _blocked | length == 0 and _bad | length == 0
                          else ((('install bash' if 'nobash' in _blocked else 'install coreutils')
                                 ~ ', or unset can_i_reach_dc_agentless to use wait_for instead')
                                if _blocked | length > 0
                                else 'open the listed ports (3268/3269 = Global Catalog, 464 = kpasswd);'
                                     ~ ' timeout = dropped by a firewall, refused = host up but nothing listening')}]}) }}
  loop: "{{ _can_i_reach_dcs }}"
  loop_control:
    loop_var: _can_i_reach_dc
    label: "{{ _can_i_reach_dc.name | default(_can_i_reach_dc.address) }}"

# --- every DC resolves the domain apex ----------------------------------------
- name: Ask each DC for the AD domain apex
  when: not _can_i_reach_windows and can_i_reach_ad_domain | length > 0
  mcowser_p.can_i_reach.dns_query:
    name: "{{ can_i_reach_ad_domain }}"
    server: "{{ _can_i_reach_dc.address }}"
    timeout: "{{ can_i_reach_timeout }}"
    tries: "{{ can_i_reach_tries }}"
  register: _can_i_reach_dcdns_reg
  ignore_errors: "{{ not can_i_reach_fail_fast }}"
  loop: "{{ _can_i_reach_dcs }}"
  loop_control:
    loop_var: _can_i_reach_dc
    label: "{{ can_i_reach_ad_domain }}@{{ _can_i_reach_dc.address }}"

- name: Ask each DC for the AD domain apex (windows)
  when: _can_i_reach_windows and can_i_reach_ad_domain | length > 0
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'dns_query.ps1') }}"
    parameters:
      Name: "{{ can_i_reach_ad_domain }}"
      QType: A
      Server: "{{ _can_i_reach_dc.address }}"
      TimeoutSec: "{{ can_i_reach_timeout | float }}"
  register: _can_i_reach_dcdns_reg_win
  failed_when: >-
    can_i_reach_fail_fast
    and (_can_i_reach_dcdns_reg_win.result.status | default('fail')) == 'fail'
  loop: "{{ _can_i_reach_dcs }}"
  loop_control:
    loop_var: _can_i_reach_dc
    label: "{{ can_i_reach_ad_domain }}@{{ _can_i_reach_dc.address }}"

- name: Record the per-DC apex lookups
  vars:
    _dc: "{{ _can_i_reach_r._can_i_reach_dc }}"
    _dr: "{{ ' [DR]' if _dc.dr | default(false) else '' }}"
    _status: >-
      {{ (_can_i_reach_r.result.status | default('fail')) if _can_i_reach_windows
         else ('fail' if _can_i_reach_r.failed | default(false) else 'ok') }}
    _detail: >-
      {{ ((_can_i_reach_r.result.detail | default('probe script error')) if _can_i_reach_windows
          else (_can_i_reach_r.msg | default(can_i_reach_ad_domain ~ ' -> '
                ~ (_can_i_reach_r.answers | default([]) | join(', ')))))
         ~ _dr }}
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': 'dc-dns:' ~ (_dc.name | default(_dc.address)),
           'layer': 'dc',
           'status': _status,
           'detail': _detail,
           'remediation': ''}]}) }}
  loop: >-
    {{ ((_can_i_reach_dcdns_reg_win if _can_i_reach_windows else _can_i_reach_dcdns_reg).results
        | default([])) | rejectattr('skipped', 'defined') | list }}
  loop_control:
    loop_var: _can_i_reach_r
    label: "{{ _can_i_reach_r._can_i_reach_dc.address }}"

# --- AD SRV records ------------------------------------------------------------
- name: Check the AD SRV records via the system resolver
  when:
    - not _can_i_reach_windows
    - can_i_reach_ad_domain | length > 0
    - can_i_reach_ad_srv_check
  mcowser_p.can_i_reach.dns_query:
    name: "_ldap._tcp.dc._msdcs.{{ can_i_reach_ad_domain }}"
    qtype: SRV
    timeout: "{{ can_i_reach_timeout }}"
    tries: "{{ can_i_reach_tries }}"
  register: _can_i_reach_srv_reg
  ignore_errors: "{{ not can_i_reach_fail_fast }}"

- name: Check the AD SRV records via the system resolver (windows)
  when:
    - _can_i_reach_windows
    - can_i_reach_ad_domain | length > 0
    - can_i_reach_ad_srv_check
  ansible.windows.win_powershell:
    script: "{{ lookup('ansible.builtin.file', 'dns_query.ps1') }}"
    parameters:
      Name: "_ldap._tcp.dc._msdcs.{{ can_i_reach_ad_domain }}"
      QType: SRV
      TimeoutSec: "{{ can_i_reach_timeout | float }}"
  register: _can_i_reach_srv_reg_win
  failed_when: >-
    can_i_reach_fail_fast
    and (_can_i_reach_srv_reg_win.result.status | default('fail')) == 'fail'

- name: Record the AD SRV check
  when: can_i_reach_ad_domain | length > 0 and can_i_reach_ad_srv_check
  vars:
    _r: "{{ _can_i_reach_srv_reg_win if _can_i_reach_windows else _can_i_reach_srv_reg }}"
    _status: >-
      {{ (_r.result.status | default('fail')) if _can_i_reach_windows
         else ('fail' if _r.failed | default(false) else 'ok') }}
    _detail: >-
      {{ (_r.result.detail | default('probe script error')) if _can_i_reach_windows
         else (_r.msg | default('SRV: ' ~ (_r.answers | default([]) | join(' | ')))) }}
  ansible.builtin.set_fact:
    can_i_reach_result: >-
      {{ can_i_reach_result | combine({'checks': can_i_reach_result.checks + [{
           'id': 'ad:srv_ldap',
           'layer': 'dc',
           'status': _status,
           'detail': _detail,
           'remediation': '' if _status == 'ok'
                          else 'AD SRV records unreachable - is the resolver AD-aware?'}]}) }}
