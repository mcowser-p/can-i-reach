---
# Cross-field rules the schema comments promise. Fails fast with a
# pointed message instead of a mid-suite templating error.
- name: Validate role configuration
  vars:
    _no_host: "{{ can_i_reach_endpoints | selectattr('host', 'undefined') | list }}"
    _bad_proto: >-
      {{ can_i_reach_endpoints | map(attribute='protocol', default='tcp')
         | reject('in', ['tcp', 'udp', 'icmp']) | list }}
    _no_port: >-
      {{ can_i_reach_endpoints | selectattr('port', 'undefined')
         | rejectattr('protocol', 'defined') | list
         + can_i_reach_endpoints | selectattr('port', 'undefined')
         | selectattr('protocol', 'defined') | rejectattr('protocol', 'eq', 'icmp') | list }}
    _path_clash: >-
      {{ can_i_reach_endpoints | selectattr('path', 'defined')
         | selectattr('protocol', 'defined')
         | selectattr('protocol', 'in', ['udp', 'icmp']) | list }}
    _proxy_no_url: "{{ can_i_reach_proxies | selectattr('url', 'undefined') | list }}"
    _proxy_no_tests: >-
      {{ can_i_reach_proxies | selectattr('test_urls', 'undefined') | list
         + can_i_reach_proxies | selectattr('test_urls', 'defined')
         | selectattr('test_urls', 'eq', []) | list }}
    _dc_no_addr: "{{ can_i_reach_domain_controllers | selectattr('address', 'undefined') | list }}"
    _smb_no_unc: "{{ can_i_reach_smb_shares | selectattr('unc', 'undefined') | list }}"
    _dns_no_name: "{{ can_i_reach_dns_queries | selectattr('name', 'undefined') | list }}"
    _time_no_addr: "{{ can_i_reach_time_sources | selectattr('address', 'undefined') | list }}"
    _bad_fix: "{{ can_i_reach_remediate | reject('in', ['sync_time', 'flush_dns']) | list }}"
    # The agentless sweep interpolates these into a shell/PowerShell
    # command, so anything outside the hostname/IP charset is rejected
    # rather than executed. Checked unconditionally: a DC address with a
    # shell metacharacter is a broken config in every mode.
    _dc_unsafe: >-
      {{ can_i_reach_domain_controllers | selectattr('address', 'defined')
         | map(attribute='address') | reject('match', '^[A-Za-z0-9._:-]+$') | list }}
    _bad_ports: >-
      {{ can_i_reach_dc_tcp_ports | reject('match', '^[0-9]+$') | list
         + can_i_reach_dc_tcp_ports | select('match', '^[0-9]+$')
         | map('int') | reject('in', range(1, 65536)) | list }}
  ansible.builtin.assert:
    that:
      - can_i_reach_fail_on in ['fail', 'warn', 'never']
      - can_i_reach_repo_mode in ['refresh', 'urls']
      - _no_host | length == 0
      - _bad_proto | length == 0
      - _no_port | length == 0
      - _path_clash | length == 0
      - _proxy_no_url | length == 0
      - _proxy_no_tests | length == 0
      - _dc_no_addr | length == 0
      - _smb_no_unc | length == 0
      - _dns_no_name | length == 0
      - _time_no_addr | length == 0
      - _bad_fix | length == 0
      - _dc_unsafe | length == 0
      - _bad_ports | length == 0
    fail_msg: >-
      can-i-reach configuration is invalid.
      {{ 'fail_on must be fail|warn|never. ' if can_i_reach_fail_on not in ['fail', 'warn', 'never'] else '' }}
      {{ 'repo_mode must be refresh|urls. ' if can_i_reach_repo_mode not in ['refresh', 'urls'] else '' }}
      {{ 'endpoints without host: ' ~ (_no_host | string) ~ '. ' if _no_host | length > 0 else '' }}
      {{ 'unknown endpoint protocol(s): ' ~ (_bad_proto | join(', ')) ~ '. ' if _bad_proto | length > 0 else '' }}
      {{ 'non-icmp endpoints need a port: ' ~ (_no_port | string) ~ '. ' if _no_port | length > 0 else '' }}
      {{ 'path only applies to tcp/http endpoints: ' ~ (_path_clash | string) ~ '. ' if _path_clash | length > 0 else '' }}
      {{ 'proxies need url: ' ~ (_proxy_no_url | string) ~ '. ' if _proxy_no_url | length > 0 else '' }}
      {{ 'proxies need non-empty test_urls: ' ~ (_proxy_no_tests | string) ~ '. ' if _proxy_no_tests | length > 0 else '' }}
      {{ 'domain_controllers need address: ' ~ (_dc_no_addr | string) ~ '. ' if _dc_no_addr | length > 0 else '' }}
      {{ 'smb_shares need unc: ' ~ (_smb_no_unc | string) ~ '. ' if _smb_no_unc | length > 0 else '' }}
      {{ 'dns_queries need name: ' ~ (_dns_no_name | string) ~ '. ' if _dns_no_name | length > 0 else '' }}
      {{ 'time_sources need address: ' ~ (_time_no_addr | string) ~ '. ' if _time_no_addr | length > 0 else '' }}
      {{ 'unknown remediation id(s): ' ~ (_bad_fix | join(', ')) ~ ' (available: sync_time, flush_dns). ' if _bad_fix | length > 0 else '' }}
      {{ 'domain controller address(es) outside the hostname/IP charset: ' ~ (_dc_unsafe | join(', ')) ~ '. ' if _dc_unsafe | length > 0 else '' }}
      {{ 'dc_tcp_ports must be integers 1-65535, got: ' ~ (_bad_ports | join(', ')) ~ '. ' if _bad_ports | length > 0 else '' }}
    success_msg: configuration ok
