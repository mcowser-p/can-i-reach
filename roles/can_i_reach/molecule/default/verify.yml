---
# set_fact results do not survive between molecule's separate
# ansible-playbook invocations, so verification re-runs the role and
# then asserts on the machine-readable result it leaves behind.
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Run the checks again for verification
      ansible.builtin.include_role:
        name: mcowser_p.can_i_reach.can_i_reach

    - name: Assert the expected verdicts
      vars:
        _c: "{{ can_i_reach_result.checks }}"
      ansible.builtin.assert:
        that:
          - _c | length == 29
          - (_c | selectattr('id', 'eq', 'tcp-blocked') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'tcp-leak') | first).status == 'fail'
          - "'expected blocked' in (_c | selectattr('id', 'eq', 'tcp-leak') | first).detail"
          - (_c | selectattr('id', 'eq', 'icmp-blocked') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'http-blocked') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'http-leak') | first).status == 'fail'
          - (_c | selectattr('id', 'eq', 'udp-closed-not-blocked') | first).status == 'warn'
          - (_c | selectattr('id', 'eq', 'udp-leak') | first).status == 'fail'
          - (_c | selectattr('id', 'eq', 'http-ok') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'http-via-proxy') | first).status == 'ok'
          - "'via proxy corp' in (_c | selectattr('id', 'eq', 'http-via-proxy') | first).detail"
          - (_c | selectattr('id', 'eq', 'http-via-dead-proxy') | first).status == 'fail'
          - (_c | selectattr('id', 'eq', 'http-direct-explicit') | first).status == 'ok'
          - "'direct' in (_c | selectattr('id', 'eq', 'http-direct-explicit') | first).detail"
          - (_c | selectattr('id', 'eq', 'proxy:corp:proxied.test') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'tcp-ok') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'tcp-closed') | first).status == 'fail'
          - (_c | selectattr('id', 'eq', 'udp-echo') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'ping-loop') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'dns:host.test') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'dns@127.0.0.1:host.test') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'dc:fake-dc') | first).status == 'ok'
          # discovered from the domain's records: dc1 via SRV, ns1 via NS
          - (_c | selectattr('id', 'eq', 'discover:dc') | first).status == 'ok'
          - "'dc1=127.0.0.2' in (_c | selectattr('id', 'eq', 'discover:dc') | first).detail"
          - (_c | selectattr('id', 'eq', 'discover:dns') | first).status == 'ok'
          - "'ns1.host.test=127.0.0.2' in (_c | selectattr('id', 'eq', 'discover:dns') | first).detail"
          - (_c | selectattr('id', 'eq', 'dc:dc1') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'dc-dns:dc1') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'dc-dns:fake-dc') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'dns@127.0.0.2:host.test') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'ad:srv_ldap') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'ntp:fake-ntp') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'noegress:10.255.255.1') | first).status == 'ok'
          - (_c | selectattr('id', 'eq', 'repo:refresh') | first).status == 'ok'
          - _c | selectattr('status', 'eq', 'fail') | list | length == 5
          - _c | selectattr('status', 'eq', 'warn') | list | length == 1
        fail_msg: "unexpected records: {{ _c }}"

    - name: Stat the report file
      ansible.builtin.stat:
        path: /tmp/can-i-reach-report.yml
      register: _can_i_reach_report_stat

    - name: Assert the report file was written
      ansible.builtin.assert:
        that:
          - _can_i_reach_report_stat.stat.exists
          - _can_i_reach_report_stat.stat.size > 0
