---
driver:
  name: docker
platforms:
  - name: cir-alma9
    image: almalinux:9
    pre_build_image: true
  - name: cir-ubuntu
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    pre_build_image: true

role_name_check: 1
# The role calls its own collection modules by FQCN, so the collection
# itself (built from this checkout) must be installed (--force keeps it
# current with the working tree), not just the galaxy requirements.
# community.docker is for molecule's own docker create/destroy
# playbooks. Everything goes to the default user collections path.
dependency:
  name: shell
  command: >-
    bash -c "ansible-galaxy collection install ${MOLECULE_PROJECT_DIRECTORY}/../.. --force
    && ansible-galaxy collection install -r ${MOLECULE_PROJECT_DIRECTORY}/../../requirements.yml
    && ansible-galaxy collection install community.docker"
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - verify
    - destroy
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        can_i_reach_fail_on: never
        can_i_reach_timeout: 4
        # containers already run as root, and almalinux:9 has no sudo
        can_i_reach_repo_become: false
        can_i_reach_report_path: /tmp/can-i-reach-report.yml
        can_i_reach_endpoints:
          - {name: http-ok, host: 127.0.0.1, port: 8080, path: /, status_codes: [200]}
          # proxied.test resolves nowhere — only the fake proxy knows it,
          # so a 200 proves the request went through the proxy (with auth)
          - {name: http-via-proxy, host: proxied.test, port: 80, path: /, proxy: corp}
          - {name: http-via-dead-proxy, host: 127.0.0.1, port: 8080, path: /, proxy: dead, timeout: 2}
          - {name: http-direct-explicit, host: 127.0.0.1, port: 8080, path: /, proxy: false}
          - {name: tcp-ok, host: 127.0.0.1, port: 8080}
          - {name: tcp-closed, host: 127.0.0.1, port: 9, timeout: 2}
          - {name: udp-echo, host: 127.0.0.1, port: 19999, protocol: udp, expect_reply: true}
          - {name: ping-loop, host: 127.0.0.1, protocol: icmp}
          # expect: unreachable — closed/unroutable targets pass, open ones fail
          - {name: tcp-blocked, host: 127.0.0.1, port: 9, timeout: 2, expect: unreachable}
          - {name: tcp-leak, host: 127.0.0.1, port: 8080, expect: unreachable}
          - {name: icmp-blocked, host: 10.255.255.1, timeout: 2, protocol: icmp, expect: unreachable}
          - {name: http-blocked, host: 10.255.255.1, port: 443, path: /, timeout: 2, expect: unreachable}
          - {name: http-leak, host: 127.0.0.1, port: 8080, path: /, expect: unreachable}
          # a closed loopback UDP port answers ICMP unreachable: host reached → warn
          - {name: udp-closed-not-blocked, host: 127.0.0.1, port: 50123, protocol: udp, timeout: 2, expect: unreachable}
          - {name: udp-leak, host: 127.0.0.1, port: 19999, protocol: udp, expect: unreachable}
        can_i_reach_dns_queries:
          - {name: host.test, expected_values: [127.0.0.1]}
        can_i_reach_domain_controllers:
          - {name: fake-dc, address: 127.0.0.1}
        can_i_reach_dc_tcp_ports: [53]
        # discovery: dc1 (SRV) and ns1 (NS) both resolve to 127.0.0.2
        can_i_reach_ad_domain: host.test
        can_i_reach_discover_domain_controllers: true
        can_i_reach_discover_dns_servers: true
        can_i_reach_time_sources:
          - {name: fake-ntp, address: 127.0.0.1}
        can_i_reach_forbidden_urls:
          - https://10.255.255.1
        can_i_reach_proxies:
          - {name: corp, url: "http://127.0.0.1:3128", username: user, password: pass,
             test_urls: ["http://proxied.test/"]}
          - {name: dead, url: "http://127.0.0.1:9"}
