---
- name: Prepare loopback test services
  hosts: all
  gather_facts: true
  tasks:
    - name: Install dnsmasq and ping (RedHat)
      when: ansible_os_family == 'RedHat'
      ansible.builtin.dnf:
        name: [dnsmasq, iputils]
        state: present

    - name: Install dnsmasq and ping (Debian)
      when: ansible_os_family == 'Debian'
      ansible.builtin.apt:
        name: [dnsmasq, iputils-ping]
        state: present
        update_cache: true

    - name: Publish the test name in /etc/hosts
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: 127.0.0.1 host.test
        state: present
        # /etc/hosts is a bind mount inside docker — atomic rename fails
        unsafe_writes: true

    # dnsmasq is the system resolver from here on (forwarding the rest to
    # Docker's embedded DNS) and serves the AD-style records discovery
    # looks for. 127.0.0.2 plays the *discovered* server: the SRV target
    # dc1.host.test and the NS target ns1.host.test both live there, so
    # a check against 127.0.0.2 can only come from discovery.
    # The upstream servers are whatever Docker gave the container: on the
    # default bridge that is the host's resolvers, on a user-defined
    # network the embedded 127.0.0.11 — read them before resolv.conf is
    # replaced below.
    - name: Read the container's original nameservers
      ansible.builtin.slurp:
        src: /etc/resolv.conf
      register: _can_i_reach_resolv

    - name: Start dnsmasq on loopback with the AD-style records
      vars:
        _upstreams: >-
          {{ _can_i_reach_resolv.content | b64decode | regex_findall('(?m)^nameserver\s+(\S+)')
             | reject('match', '^127\.0\.0\.[12]$') | list }}
      ansible.builtin.shell:
        cmd: >-
          pgrep -x dnsmasq || dnsmasq --bind-interfaces --no-resolv
          {% for u in _upstreams %}--server={{ u }} {% endfor %}
          --listen-address=127.0.0.1 --listen-address=127.0.0.2
          --host-record=dc1.host.test,127.0.0.2
          --host-record=ns1.host.test,127.0.0.2
          --srv-host=_ldap._tcp.dc._msdcs.host.test,dc1.host.test,389,0,100
          --dns-rr=host.test,2,036e733104686f7374047465737400
      changed_when: true

    - name: Point the system resolver at dnsmasq
      ansible.builtin.copy:
        dest: /etc/resolv.conf
        content: "nameserver 127.0.0.1\n"
        mode: "0644"
        # /etc/resolv.conf is a bind mount inside docker — atomic rename fails
        unsafe_writes: true

    - name: Deploy the fake NTP server
      ansible.builtin.copy:
        dest: /opt/fake_ntp.py
        mode: "0644"
        content: |
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.bind(("127.0.0.1", 123))
          while True:
              data, addr = s.recvfrom(512)
              # LI=0 VN=4 mode=4 (server), stratum 2
              s.sendto(bytes([0x24, 2]) + b"\x00" * 46, addr)

    - name: Deploy the UDP echo server
      ansible.builtin.copy:
        dest: /opt/udp_echo.py
        mode: "0644"
        content: |
          import socket
          s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
          s.bind(("127.0.0.1", 19999))
          while True:
              data, addr = s.recvfrom(512)
              s.sendto(b"pong", addr)

    # A forward proxy that demands Basic auth (user:pass) and is the only
    # thing that can resolve proxied.test (it rewrites it to the local
    # HTTP server) — so success through it is proof of proxy routing.
    - name: Deploy the fake authenticating proxy
      ansible.builtin.copy:
        dest: /opt/fake_proxy.py
        mode: "0644"
        content: |
          import base64, http.server, socketserver, urllib.parse, urllib.request
          AUTH = "Basic " + base64.b64encode(b"user:pass").decode()
          class Proxy(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if self.headers.get("Proxy-Authorization") != AUTH:
                      self.send_response(407)
                      self.send_header("Proxy-Authenticate", 'Basic realm="fake"')
                      self.send_header("Content-Length", "0")
                      self.end_headers()
                      return
                  u = urllib.parse.urlsplit(self.path)
                  if u.hostname == "proxied.test":
                      u = u._replace(netloc="127.0.0.1:8080")
                  try:
                      with urllib.request.urlopen(urllib.parse.urlunsplit(u), timeout=5) as r:
                          body = r.read()
                          self.send_response(r.status)
                  except Exception:
                      body = b""
                      self.send_response(502)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Via", "1.1 fake-proxy")
                  self.end_headers()
                  self.wfile.write(body)
              def log_message(self, *args):
                  pass
          class Server(socketserver.ThreadingMixIn, http.server.HTTPServer):
              daemon_threads = True
          Server(("127.0.0.1", 3128), Proxy).serve_forever()

    # No "already running" guards: prepare runs once per fresh container,
    # and pgrep -f would match its own invoking shell anyway.
    - name: Start the fake NTP server
      ansible.builtin.shell:
        cmd: nohup python3 /opt/fake_ntp.py >/dev/null 2>&1 &
      changed_when: true

    - name: Start the UDP echo server
      ansible.builtin.shell:
        cmd: nohup python3 /opt/udp_echo.py >/dev/null 2>&1 &
      changed_when: true

    - name: Start the HTTP server
      ansible.builtin.shell:
        cmd: cd /opt && nohup python3 -m http.server 8080 >/dev/null 2>&1 &
      changed_when: true

    - name: Start the fake proxy
      ansible.builtin.shell:
        cmd: nohup python3 /opt/fake_proxy.py >/dev/null 2>&1 &
      changed_when: true

    - name: Wait for the TCP listeners
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: "{{ item }}"
        timeout: 15
      loop: [53, 8080, 3128]
